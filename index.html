<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator" aria-label="Calculator">
        <header class="display-wrap">
          <p id="expression" class="expression" aria-live="polite"></p>
          <input
            type="text"
            id="numpad"
            class="display"
            value="0"
            readonly
            aria-label="Calculator display"
          />
        </header>

        <div class="keyboard" role="group" aria-label="Calculator controls">
          <button type="button" class="key key-fn" data-action="clear">C</button>
          <button type="button" class="key key-fn" data-action="percent">%</button>
          <button type="button" class="key key-fn" data-action="delete" aria-label="Delete one character">
            ⌫
          </button>
          <button type="button" class="key key-op" data-value="/">÷</button>

          <button type="button" class="key" data-value="7">7</button>
          <button type="button" class="key" data-value="8">8</button>
          <button type="button" class="key" data-value="9">9</button>
          <button type="button" class="key key-op" data-value="*">×</button>

          <button type="button" class="key" data-value="4">4</button>
          <button type="button" class="key" data-value="5">5</button>
          <button type="button" class="key" data-value="6">6</button>
          <button type="button" class="key key-op" data-value="-">−</button>

          <button type="button" class="key" data-value="1">1</button>
          <button type="button" class="key" data-value="2">2</button>
          <button type="button" class="key" data-value="3">3</button>
          <button type="button" class="key key-op" data-value="+">+</button>

          <button type="button" class="key key-zero" data-value="0">0</button>
          <button type="button" class="key" data-value=".">.</button>
          <button type="button" class="key key-eq" data-action="equals">=</button>
        </div>
      </section>
    </main>

    <script src="calc.js"></script>
  </body>
</html>
